<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Arial, "PingFang SC", sans-serif; }
    .ttl { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 700; fill: #f5f0eb; }
    .sub { font-size: 12px; fill: #a39787; }
    .sec { font-family: Georgia, "Times New Roman", serif; font-size: 11px; font-weight: 700; fill: #c9a96e; opacity: 0.75; }
    .nm  { font-size: 14px; font-weight: 600; }
    .sm  { font-size: 10px; fill: #a39787; }
    .xs  { font-size: 9px; fill: #6b5f53; }
    .fn  { font-family: "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace; font-size: 10px; fill: #a39787; }
    .ph  { font-family: "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace; font-size: 12px; font-weight: 600; }
    .vb  { font-family: "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace; font-size: 10px; fill: #c9a96e; }
    .gl  { font-size: 9px; }
  </style>
  <defs>
    <marker id="arr-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#8c7458"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#0a0a0a"/>
  <text x="48" y="50" class="ttl">The Delivery pipeline</text>
  <text x="48" y="74" class="sub">One issue, phase by phase &#8212; the closed lifecycle the run engine drives, with a human at both gates.</text>
  <line x1="48" y1="94" x2="912" y2="94" stroke="#1a1a1a" stroke-width="1"/>

  <!-- ============ plan gate ============ -->
  <rect x="48" y="118" width="270" height="86" rx="6" fill="#111111" stroke="#d4a574" stroke-width="1.5"/>
  <text x="64" y="142" class="nm" fill="#e8c49a">Plan gate</text>
  <text x="64" y="162" class="sm">executor + reviewer derived from issue</text>
  <text x="64" y="176" class="sm">facts alone &#8212; you read it, you approve it</text>
  <text x="64" y="194" class="xs">approving is what enters Delivery</text>
  <circle cx="262" cy="140" r="14" fill="none" stroke="#e8c49a" stroke-width="1.5">
    <animate attributeName="opacity" values="0.8;0.15;0.8;0.15;0.8;0;0" keyTimes="0;0.016;0.032;0.048;0.064;0.08;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0">
    <rect x="230" y="128" width="72" height="22" rx="11" fill="#1a1a1a" stroke="#d4a574" stroke-width="1.2"/>
    <text x="266" y="143" class="xs" fill="#e8c49a" text-anchor="middle">approved</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.09;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <text x="336" y="142" class="fn" opacity="0">
    delivery.lock acquired &#183; worktrees created
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.105;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- ============ verb labels row 1 ============ -->
  <text x="203" y="250" class="vb" text-anchor="middle">activate</text>
  <text x="531" y="250" class="vb" text-anchor="middle">dispatch</text>
  <text x="695" y="250" class="vb" text-anchor="middle">pr-open</text>
  <text x="789" y="356" class="vb">review</text>
  <text x="695" y="408" class="vb" text-anchor="middle">merge-report</text>
  <text x="531" y="408" class="vb" text-anchor="middle">merge</text>
  <text x="367" y="408" class="vb" text-anchor="middle">cleanup</text>
  <text x="203" y="408" class="vb" text-anchor="middle">complete</text>

  <!-- ============ arrows ============ -->
  <g stroke="#8c7458" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M 194,289 L 208,289" marker-end="url(#arr-gold)"/>
    <path d="M 358,289 L 372,289" marker-end="url(#arr-gold)"/>
    <path d="M 522,289 L 536,289" marker-end="url(#arr-gold)"/>
    <path d="M 686,289 L 700,289" marker-end="url(#arr-gold)"/>
    <path d="M 777,318 L 777,416" marker-end="url(#arr-gold)"/>
    <path d="M 704,449 L 690,449" marker-end="url(#arr-gold)"/>
    <path d="M 540,449 L 526,449" marker-end="url(#arr-gold)"/>
    <path d="M 376,449 L 362,449" marker-end="url(#arr-gold)"/>
    <path d="M 212,449 L 198,449" marker-end="url(#arr-gold)"/>
    <path d="M 121,204 L 121,254" marker-end="url(#arr-gold)"/>
  </g>

  <!-- review cycle loop -->
  <circle cx="884" cy="449" r="30" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
  <text x="884" y="497" class="xs" fill="#a78bfa" text-anchor="middle">request-changes &#8635;</text>

  <!-- ============ phase chips: dim base + lit overlay ============ -->
  <!-- row 1 -->
  <g>
    <rect x="48" y="260" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="121" y="284" class="ph" fill="#8c7e72" text-anchor="middle">planned</text>
    <text x="121" y="302" class="gl" fill="#6b5f53" text-anchor="middle">in the approved plan</text>
  </g>
  <g opacity="0">
    <rect x="48" y="260" width="146" height="58" rx="6" fill="#161310" stroke="#d4a574" stroke-width="1.6"/>
    <text x="121" y="284" class="ph" fill="#d4a574" text-anchor="middle">planned</text>
    <text x="121" y="302" class="gl" fill="#a39787" text-anchor="middle">in the approved plan</text>
    <text x="182" y="276" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.11;0.115;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="212" y="260" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="285" y="284" class="ph" fill="#8c7e72" text-anchor="middle">issue-created</text>
    <text x="285" y="302" class="gl" fill="#6b5f53" text-anchor="middle">issue + audit record</text>
  </g>
  <g opacity="0">
    <rect x="212" y="260" width="146" height="58" rx="6" fill="#161310" stroke="#d4a574" stroke-width="1.6"/>
    <text x="285" y="284" class="ph" fill="#d4a574" text-anchor="middle">issue-created</text>
    <text x="285" y="302" class="gl" fill="#a39787" text-anchor="middle">issue + audit record</text>
    <text x="346" y="276" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.195;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="376" y="260" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="449" y="284" class="ph" fill="#8c7e72" text-anchor="middle">worktree-ready</text>
    <text x="449" y="302" class="gl" fill="#6b5f53" text-anchor="middle">branch + worktree made</text>
  </g>
  <g opacity="0">
    <rect x="376" y="260" width="146" height="58" rx="6" fill="#161310" stroke="#d4a574" stroke-width="1.6"/>
    <text x="449" y="284" class="ph" fill="#d4a574" text-anchor="middle">worktree-ready</text>
    <text x="449" y="302" class="gl" fill="#a39787" text-anchor="middle">branch + worktree made</text>
    <text x="510" y="276" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.265;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="540" y="260" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="613" y="284" class="ph" fill="#8c7e72" text-anchor="middle">dispatched</text>
    <text x="613" y="302" class="gl" fill="#6b5f53" text-anchor="middle">executor at work</text>
  </g>
  <g opacity="0">
    <rect x="540" y="260" width="146" height="58" rx="6" fill="#101512" stroke="#5a9e6f" stroke-width="1.6"/>
    <text x="613" y="284" class="ph" fill="#5a9e6f" text-anchor="middle">dispatched</text>
    <text x="613" y="302" class="gl" fill="#a39787" text-anchor="middle">executor at work</text>
    <text x="674" y="276" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.335;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="704" y="260" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="777" y="284" class="ph" fill="#8c7e72" text-anchor="middle">pr-open</text>
    <text x="777" y="302" class="gl" fill="#6b5f53" text-anchor="middle">PR up, strictly ahead</text>
  </g>
  <g opacity="0">
    <rect x="704" y="260" width="146" height="58" rx="6" fill="#101512" stroke="#5a9e6f" stroke-width="1.6"/>
    <text x="777" y="284" class="ph" fill="#5a9e6f" text-anchor="middle">pr-open</text>
    <text x="777" y="302" class="gl" fill="#a39787" text-anchor="middle">PR up, strictly ahead</text>
    <text x="838" y="276" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.41;0.415;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- row 2 -->
  <g>
    <rect x="704" y="420" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="777" y="444" class="ph" fill="#8c7e72" text-anchor="middle">in-review</text>
    <text x="777" y="462" class="gl" fill="#6b5f53" text-anchor="middle">independent review &#183; CI</text>
  </g>
  <g opacity="0">
    <rect x="704" y="420" width="146" height="58" rx="6" fill="#131019" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="777" y="444" class="ph" fill="#a78bfa" text-anchor="middle">in-review</text>
    <text x="777" y="462" class="gl" fill="#a39787" text-anchor="middle">independent review &#183; CI</text>
    <text x="838" y="436" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.485;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="540" y="420" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="613" y="444" class="ph" fill="#8c7e72" text-anchor="middle">awaiting-merge</text>
    <text x="613" y="462" class="gl" fill="#6b5f53" text-anchor="middle">head OID pinned</text>
  </g>
  <g opacity="0">
    <rect x="540" y="420" width="146" height="58" rx="6" fill="#171307" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="613" y="444" class="ph" fill="#fbbf24" text-anchor="middle">awaiting-merge</text>
    <text x="613" y="462" class="gl" fill="#a39787" text-anchor="middle">head OID pinned</text>
    <text x="674" y="436" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.685;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="376" y="420" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="449" y="444" class="ph" fill="#8c7e72" text-anchor="middle">merged</text>
    <text x="449" y="462" class="gl" fill="#6b5f53" text-anchor="middle">delivered &#183; closed</text>
  </g>
  <g opacity="0">
    <rect x="376" y="420" width="146" height="58" rx="6" fill="#0f1613" stroke="#6ee7b7" stroke-width="1.6"/>
    <text x="449" y="444" class="ph" fill="#6ee7b7" text-anchor="middle">merged</text>
    <text x="449" y="462" class="gl" fill="#a39787" text-anchor="middle">delivered &#183; closed</text>
    <text x="510" y="436" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.79;0.795;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="212" y="420" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="285" y="444" class="ph" fill="#8c7e72" text-anchor="middle">cleaned</text>
    <text x="285" y="462" class="gl" fill="#6b5f53" text-anchor="middle">worktree removed</text>
  </g>
  <g opacity="0">
    <rect x="212" y="420" width="146" height="58" rx="6" fill="#121316" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="285" y="444" class="ph" fill="#94a3b8" text-anchor="middle">cleaned</text>
    <text x="285" y="462" class="gl" fill="#a39787" text-anchor="middle">worktree removed</text>
    <text x="346" y="436" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.85;0.855;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="48" y="420" width="146" height="58" rx="6" fill="#111111" stroke="#3a352e" stroke-width="1.2"/>
    <text x="121" y="444" class="ph" fill="#8c7e72" text-anchor="middle">complete</text>
    <text x="121" y="462" class="gl" fill="#6b5f53" text-anchor="middle">&#8594; back to Assist</text>
  </g>
  <g opacity="0">
    <rect x="48" y="420" width="146" height="58" rx="6" fill="#161310" stroke="#e8c49a" stroke-width="1.6"/>
    <text x="121" y="444" class="ph" fill="#e8c49a" text-anchor="middle">complete</text>
    <text x="121" y="462" class="gl" fill="#a39787" text-anchor="middle">&#8594; back to Assist</text>
    <text x="182" y="436" class="gl" fill="#e8c49a">&#10003;</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.91;0.915;0.955;0.985;1" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- writable-phase underlines -->
  <g stroke="#6ee7b7" stroke-width="2" opacity="0.55">
    <line x1="556" y1="326" x2="670" y2="326"/>
    <line x1="720" y1="326" x2="834" y2="326"/>
    <line x1="720" y1="486" x2="834" y2="486"/>
  </g>

  <!-- merge gate labels -->
  <g opacity="0.45">
    <text x="531" y="498" class="sm" fill="#e8c49a" text-anchor="middle">you approve the merge</text>
    <text x="531" y="511" class="fn" text-anchor="middle">gh pr merge --match-head-commit &lt;approved OID&gt;</text>
    <animate attributeName="opacity" values="0.45;0.45;1;1;0.45;0.45" keyTimes="0;0.68;0.69;0.78;0.79;1" dur="10s" repeatCount="indefinite"/>
  </g>
  <path d="M 540,449 L 526,449" stroke="#e8c49a" stroke-width="3" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.25;0.9;0.25;0.9;0;0" keyTimes="0;0.68;0.69;0.71;0.73;0.75;0.76;0.77;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- legend line -->
  <line x1="48" y1="521" x2="78" y2="521" stroke="#6ee7b7" stroke-width="2" opacity="0.55"/>
  <text x="86" y="524" class="xs">the guard allows agent writes only in these phases &#8212; and only inside the issue's worktree</text>

  <!-- ============ token ============ -->
  <g opacity="0">
    <circle r="8" fill="#d4a574" opacity="0.3"/>
    <circle r="4.5" fill="#e8c49a" stroke="#d4a574" stroke-width="1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.085;0.95;0.985;1" dur="10s" repeatCount="indefinite"/>
    <animateMotion
      path="M 121,232 L 121,311 L 285,311 L 449,311 L 613,311 L 777,311 L 777,471 L 884,479 A 30,30 0 1 1 884,478.9 L 777,471 L 613,471 L 449,471 L 285,471 L 121,471"
      calcMode="linear"
      keyPoints="0;0;0.04043;0.04043;0.12435;0.12435;0.20828;0.20828;0.29221;0.29221;0.37614;0.37614;0.45801;0.45801;0.51292;0.60938;0.66430;0.66430;0.74822;0.74822;0.83215;0.83215;0.91608;0.91608;1;1"
      keyTimes="0;0.08;0.11;0.15;0.19;0.22;0.26;0.29;0.33;0.37;0.41;0.44;0.48;0.50;0.52;0.60;0.62;0.64;0.68;0.76;0.79;0.82;0.85;0.88;0.91;1"
      dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- ============ bottom panels ============ -->
  <rect x="48" y="540" width="522" height="96" rx="8" fill="none" stroke="#f87171" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.35"/>
  <text x="60" y="558" class="sec" fill="#b98a86">FAILURE ROUTES &#183; FROM ANY NON-TERMINAL PHASE</text>
  <g opacity="0.6">
    <rect x="64" y="570" width="152" height="48" rx="6" fill="#111111" stroke="#f87171" stroke-width="1"/>
    <text x="76" y="589" class="sm" fill="#f87171" font-weight="600">escalate</text>
    <text x="76" y="605" class="xs">failed model is retired</text>
    <rect x="232" y="570" width="152" height="48" rx="6" fill="#111111" stroke="#f87171" stroke-width="1"/>
    <text x="244" y="589" class="sm" fill="#f87171" font-weight="600">block</text>
    <text x="244" y="605" class="xs">a secret stops the run</text>
    <rect x="400" y="570" width="152" height="48" rx="6" fill="#111111" stroke="#f87171" stroke-width="1"/>
    <text x="412" y="589" class="sm" fill="#f87171" font-weight="600">abandon</text>
    <text x="412" y="605" class="xs">PR closed &#183; work preserved</text>
  </g>

  <rect x="586" y="540" width="326" height="96" rx="8" fill="none" stroke="#d4a574" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="598" y="558" class="sec">ENGINE GUARANTEES</text>
  <text x="598" y="580" class="xs" fill="#a39787">errors never mutate state; it advances only on success</text>
  <text x="598" y="598" class="xs" fill="#a39787">state.json persisted after every sub-step (each &#10003;)</text>
  <text x="598" y="616" class="xs" fill="#a39787">orch resume reconciles a crashed run against GitHub</text>

  <!-- completion banner -->
  <text x="480" y="668" class="sub" fill="#e8c49a" text-anchor="middle" opacity="0">
    every issue cleaned &#8212; delivery.lock released, the repository returns to Assist
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.91;0.925;0.965;0.99;1" dur="10s" repeatCount="indefinite"/>
  </text>
</svg>
